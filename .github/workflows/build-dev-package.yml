          assert(ui.includes('data-dbua-aw-cost'));
          assert(css.includes('.dbua-aw-extra-fields'));
          assert(css.includes('.dbu-transform-manager #dbu-tf-select'));
          assert(!ui.includes('data-hud-tab'), 'individual windows must not include action selector');
          console.log('Energy Charge and Transformation Windows 2.0 smoke tests: PASS');
