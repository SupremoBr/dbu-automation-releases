name: Build DBU DEV package

on:
  push:
    branches: [main]
    paths:
      - '.build-dev/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build DEV from current Stable package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dbu-dev-package
          mkdir -p /tmp/dbu-dev-package
          unzip -q stable/dbu-automation.zip -d /tmp/dbu-dev-package

          # Convert only hardcoded package namespaces. Dynamic channel
          # detection remains untouched.
          while IFS= read -r -d '' file; do
            sed -i 's/const MODULE_ID = "dbu-automation";/const MODULE_ID = "dbu-automation-dev";/g' "$file"
            sed -i 's/const DBU_SOCKET = "module.dbu-automation";/const DBU_SOCKET = "module.dbu-automation-dev";/g' "$file"
          done < <(find /tmp/dbu-dev-package/scripts -type f -name '*.js' -print0)

          if [ -d .build-dev/overlay ]; then
            rsync -a .build-dev/overlay/ /tmp/dbu-dev-package/
          fi

          # Patch full stable-base Intervene runtime without replacing it with
          # the incomplete source snapshot. Abort on mismatched signatures.
          python3 .github/scripts/dev-token-hotfix.py

          # Keep the installed package's update links identical to the
          # public manifest, otherwise Foundry cannot detect future updates.
          cp .build-dev/public-module.json /tmp/dbu-dev-package/module.json
          cp .build-dev/public-module.json dev/module.json

      - name: Validate JavaScript and relative imports
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file" >/dev/null
          done < <(find /tmp/dbu-dev-package/scripts -type f -name '*.js' -print0)

          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          root = Path("/tmp/dbu-dev-package")

          module = __import__("json").loads((root / "module.json").read_text(encoding="utf-8"))
          assert module["id"] == "dbu-automation-dev"
          expected = __import__("json").loads(Path(".build-dev/package-module.json").read_text(encoding="utf-8"))["version"]
          assert module["version"] == expected
          public_manifest = __import__("json").loads(Path(".build-dev/public-module.json").read_text(encoding="utf-8"))
          assert module == public_manifest, "Installed and public manifests must match"
          assert module.get("manifest") == "https://raw.githubusercontent.com/SupremoBr/dbu-automation-releases/main/dev/module.json", "Missing auto-update manifest"
          assert module.get("download") == "https://raw.githubusercontent.com/SupremoBr/dbu-automation-releases/main/dev/dbu-automation-dev.zip", "Missing download URL"

          languages = {x["lang"]: x["path"] for x in module.get("languages", [])}
          assert languages.get("pt-BR") == "lang/pt-BR.json"
          assert "en" not in languages

          forbidden = []
          for file in (root / "scripts").rglob("*.js"):
              text = file.read_text(encoding="utf-8")
              if 'const MODULE_ID = "dbu-automation";' in text:
                  forbidden.append(f"{file.relative_to(root)}: hardcoded Stable MODULE_ID")
              if 'const DBU_SOCKET = "module.dbu-automation";' in text:
                  forbidden.append(f"{file.relative_to(root)}: hardcoded Stable socket")
          if forbidden:
              print("Forbidden Stable namespace references in DEV package:")
              print("\n".join(forbidden))
              sys.exit(1)

          missing = []
          pattern = re.compile(r'''(?:import|export)\s+(?:[^"'\n]+?\s+from\s+)?["'](\.[^"']+)["']''')
          for file in root.rglob("*.js"):
              text = file.read_text(encoding="utf-8")
              for rel in pattern.findall(text):
                  target = (file.parent / rel).resolve()
                  if target.suffix:
                      candidates = [target]
                  else:
                      candidates = [Path(str(target) + ".js"), target / "index.js"]
                  if not any(p.exists() for p in candidates):
                      missing.append(f"{file.relative_to(root)} -> {rel}")
          if missing:
              print("Missing relative imports:")
              print("\n".join(missing))
              sys.exit(1)
          PY

      - name: Smoke-test Synthetic Actor identity
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f /tmp/dbu-dev-package/scripts/core/token-identity.js ]; then exit 0; fi
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const source = readFileSync('/tmp/dbu-dev-package/scripts/core/token-identity.js', 'utf8');
          const identity = await import('data:text/javascript;base64,' + Buffer.from(source).toString('base64'));
          const scene = { id: 'scene-1' };
          const base = { id: 'shared-actor', uuid: 'Actor.shared-actor' };
          function makeToken(id) {
            const document = { documentName: 'Token', id, parent: scene, actorLink: false };
            const actor = { id: base.id, uuid: `Scene.scene-1.Token.${id}.Actor.shared-actor`, token: document };
            const token = { id, document, actor };
            document.actor = actor;
            return token;
          }
          const one = makeToken('monster-1');
          const two = makeToken('monster-2');
          const tokens = new Map([[one.id, one], [two.id, two]]);
          globalThis.canvas = { scene, tokens: { get: id => tokens.get(id), placeables: [one, two], controlled: [] } };
          globalThis.game = { scenes: { get: id => id === scene.id ? { tokens: { get: k => tokens.get(k)?.document } } : null } };
          const c1 = { id: 'combat-1', tokenId: one.id, actor: one.actor };
          const c2 = { id: 'combat-2', tokenId: two.id, actor: two.actor };
          const combat = { scene, combatants: { contents: [c1, c2] } };
          assert.notEqual(identity.actorIdentity(one.actor), identity.actorIdentity(two.actor));
          assert.equal(identity.sameToken(one, two), false);
          assert.equal(identity.combatantForIdentity(two.actor, two, combat), c2);
          assert.equal(identity.combatantForIdentity(one.actor, one, combat), c1);
          assert.equal(identity.combatantForIdentity(base, null, combat), null);
          assert.equal(identity.tokenForActor(base), null);
          assert.equal(identity.tokenForActor(two.actor), two);
          globalThis.canvas.tokens.controlled = [two];
          assert.equal(identity.tokenForActor(base), two);
          const oneRef = identity.participantReference(one.actor, one);
          const twoRef = identity.participantReference(two.actor, two);
          const attack = { targetRefs: [oneRef, twoRef], targetActorIds: [base.id, base.id] };
          assert.notEqual(oneRef.key, twoRef.key);
          assert.equal(identity.attackTargetKeys(attack).length, 2);
          assert.equal(identity.resolveParticipant(oneRef.key, attack), one.actor);
          assert.equal(identity.resolveParticipant(twoRef.key, attack), two.actor);
          assert.equal(identity.participantKeyForAttack(one.actor, attack), oneRef.key);
          assert.equal(identity.participantKeyForAttack(two.actor, attack), twoRef.key);
          const states = Object.fromEntries(identity.attackTargetKeys(attack).map(key => [key, { resolved: false }]));
          states[oneRef.key].resolved = true;
          assert.equal(states[twoRef.key].resolved, false, 'two unlinked creatures need independent defenses');
          assert.equal(identity.attackTargetKeys({ targetActorIds: [base.id] }).length, 1, 'legacy actor-only cards stay readable');
          assert.match(oneRef.key, /^[a-zA-Z0-9_-]+$/, 'Foundry flag keys must not contain update-path delimiters');
          assert.match(twoRef.key, /^[a-zA-Z0-9_-]+$/, 'Foundry flag keys must be safe');
          const three = makeToken('monster-3');
          const threeRef = identity.participantReference(three.actor, three);
          const all = { targetRefs: [oneRef, twoRef, threeRef] };
          const pending = Object.fromEntries(identity.attackTargetKeys(all).map(k => [k, { resolved: false }]));
          const progress = () => identity.attackTargetKeys(all).filter(k => pending[k].resolved).length;
          pending[oneRef.key].resolved = true;
          assert.equal(progress(), 1);
          pending[twoRef.key].resolved = true;
          assert.equal(progress(), 2);
          pending[threeRef.key].resolved = true;
          assert.equal(progress(), 3);
          assert.equal(identity.attackTargetKeys(all).length, 3);
          const attackCore = readFileSync('/tmp/dbu-dev-package/scripts/attack.js', 'utf8');
          const revealCore = readFileSync('/tmp/dbu-dev-package/scripts/combat/reveal-core.js', 'utf8');
          assert(attackCore.includes('targetRefs: targetTokens'), 'attacks must write unique target refs');
          assert(revealCore.includes('return attackTargetKeys(attack);'), 'GM must count distinct target keys');
          assert(revealCore.includes('const dbuDefenseCardQueues = new Map();'), 'GM card updates must use a queue');
          assert(revealCore.includes('await dbuQueueDefenseCard(data);'), 'socket updates must serialize');
          assert(revealCore.includes('await dbuQueueDefenseCard(payload);'), 'GM local updates must serialize');
          console.log('Two-clone defense smoke tests: PASS');
          const paymentSource = readFileSync('/tmp/dbu-dev-package/scripts/core/payment-actor.js', 'utf8');
          globalThis.__dbuaTestIdentity = identity;
          const paymentCode = paymentSource.replace(
            'import { resolveSceneToken, tokenForActor } from "./token-identity.js";',
            'const { resolveSceneToken, tokenForActor } = globalThis.__dbuaTestIdentity;'
          );
          const payment = await import('data:text/javascript;base64,' + Buffer.from(paymentCode).toString('base64'));
          globalThis.game.actors = { get: id => id === base.id ? base : null };
          const messageFor = ref => ({
            speaker: {},
            getFlag: (scope, name) => scope === 'world' && name === 'dbuAttackPaymentRef' ? ref : null
          });
          assert.equal(payment.resolvePaymentActor(messageFor(oneRef), {actorId:base.id,payType:'combined'}), one.actor);
          assert.equal(payment.resolvePaymentActor(messageFor(twoRef), {actorId:base.id,payType:'combined'}), two.actor);
          assert.notEqual(payment.resolvePaymentActor(messageFor(twoRef), {actorId:base.id,payType:'combined'}), base);
          assert.equal(payment.resolvePaymentActor({speaker:{scene:scene.id,token:two.id},getFlag:()=>null}, {actorId:base.id,payType:'draining'}), two.actor);
          assert.equal(payment.resolvePaymentActor({speaker:{},getFlag:()=>null}, {actorId:base.id,payType:'combined'}), null,
            'Unlinked clones with no source token must not charge the base Actor');
          const bridge = readFileSync('/tmp/dbu-dev-package/scripts/bridge/native-dbu.js','utf8');
          assert(bridge.includes('resolvePaymentActor(paymentMessage'), 'Native Pay handler must resolve token resources');
          const transformCore = readFileSync('/tmp/dbu-dev-package/scripts/transformations.js','utf8');
          assert(transformCore.includes('data-token-id="${esc(participant.tokenId || "")}"'), 'Graded transformation costs need token refs');
          console.log('Two-clone Ki payment smoke tests: PASS');
          console.log('Token identity smoke tests: PASS');
          JS

      - name: Smoke-test Transformation entry and upkeep
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const source = readFileSync('/tmp/dbu-dev-package/scripts/core/transformation-upkeep.js','utf8');
          const upkeep = await import('data:text/javascript;base64,' + Buffer.from(source).toString('base64'));
          let messages = 0;
          globalThis.ChatMessage = {getSpeaker: () => ({}), create: async () => {messages++;}};
          globalThis.foundry = {utils:{deepClone: x => structuredClone(x)}};
          globalThis.ui = {notifications:{warn:()=>{}}};
          const fakeActor = (id, tokenId, ki=35, draining=9, god=false) => {
            const a = {
              id, token:{id:tokenId}, name:'Boneco',
              flags:{},
              system:{
                kiPool:{value:ki},
                divineKiPoints:{value:25},
                godKi:{active:god},
                status:{capacitySpent:5},
                aspectEffects:{drainingKiPerTurn:draining},
                transformations:[{name:'Test Form',active:true,transformationType:'form_alternate'}],
                conditions:[]
              },
              getFlag(_scope,key){return this.flags[key]},
              async update(changes){
                for(const [key,v] of Object.entries(changes)) {
                  if(key === 'system.kiPool.value') this.system.kiPool.value=v;
                  if(key === 'system.divineKiPoints.value') this.system.divineKiPoints.value=v;
                  if(key === 'flags.world.dbuaDrainingTurn') this.flags.dbuaDrainingTurn=v;
                  if(key === 'flags.world.dbuaNoEnergyStressExpiry') this.flags.dbuaNoEnergyStressExpiry=v;
                  if(key === 'system.conditions') this.system.conditions=v;
                  if(key === 'system.transformations') this.system.transformations=v;
                }
              }
            };
            return a;
          };
          const combat = {id:'combat',round:2};
          const one = fakeActor('shared','monster-1');
          const two = fakeActor('shared','monster-2');
          const c1 = {id:'c1',actor:one,tokenId:'monster-1'};
          const c2 = {id:'c2',actor:two,tokenId:'monster-2'};
          assert.equal(upkeep.drainingForActor(one), 9);
          await upkeep.applyTransformationTurnUpkeep(combat,c1);
          assert.equal(one.system.kiPool.value,26);
          assert.equal(one.system.status.capacitySpent,5);
          assert.equal(two.system.kiPool.value,35);
          await upkeep.applyTransformationTurnUpkeep(combat,c1);
          assert.equal(one.system.kiPool.value,26,'same turn must not be debited twice');
          await upkeep.applyTransformationTurnUpkeep(combat,c2);
          assert.equal(two.system.kiPool.value,26,'other cloned token must pay its own upkeep');
          assert.equal(messages,2,'two tokens should each show one upkeep message');
          combat.round=3;
          await upkeep.applyTransformationTurnUpkeep(combat,c1);
          assert.equal(one.system.kiPool.value,17);
          const divine = fakeActor('shared','monster-3',20,9,true);
          await upkeep.applyTransformationTurnUpkeep(combat,{id:'c3',actor:divine,tokenId:'monster-3'});
          assert.equal(divine.system.kiPool.value,11);
          assert.equal(divine.system.divineKiPoints.value,20,'God Ki Draining must also reduce DKP');
          const exhausted = fakeActor('shared','monster-4',3,9);
          await upkeep.applyTransformationTurnUpkeep(combat,{id:'c4',actor:exhausted,tokenId:'monster-4'});
          assert.equal(exhausted.system.kiPool.value,0);
          assert.equal(exhausted.system.transformations[0].active,false);
          assert.equal(exhausted.system.conditions.find(c=>c.id==='stressExhaustion')?.active,true);
          const round = readFileSync('/tmp/dbu-dev-package/scripts/core/round-hooks.js','utf8');
          assert(round.includes('await requestTransformationDecision(combat, combatant)'), 'Draining must ask owner rather than auto-debit');
          assert(round.includes('turnChanged'));
          const pay = readFileSync('/tmp/dbu-dev-package/scripts/bridge/native-dbu.js','utf8');
          assert(pay.includes('payType === "draining" && game.combat?.started'), 'native manual Pay must be disabled while choices are pending');
          const tf = readFileSync('/tmp/dbu-dev-package/scripts/transformations.js','utf8');
          assert(tf.includes('sem ${isGodKiForm ? "Divine Ki" : "Ki"}'), 'No Energy entry guard missing');
          console.log('Draining per-token turn and No Energy tests: PASS');
          JS

      - name: Rebuild and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f dev/dbu-automation-dev.zip
          (cd /tmp/dbu-dev-package && zip -qr "$GITHUB_WORKSPACE/dev/dbu-automation-dev.zip" .)
          unzip -t dev/dbu-automation-dev.zip >/dev/null

      - name: Publish DEV package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("dev/module.json"))["version"])')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/module.json dev/dbu-automation-dev.zip
          git rm -rf .build-dev
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "release: publish DBU Automation DEV v${VERSION} [skip ci]"
          git push
