name: Build DBU Stable package

on:
  push:
    branches: [main]
    paths:
      - '.build-stable/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Stable hotfix from current Stable package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dbu-stable-package
          mkdir -p /tmp/dbu-stable-package
          if [ -f .build-stable/promote-dev.txt ]; then
            # Promote the tested DEV ZIP as a whole, not an incomplete source
            # overlay: Intervene/Reflect includes packaging-time integrations.
            DEV_VERSION="$(python3 -c 'import json; print(json.load(open("dev/module.json"))["version"])')"
            REQUIRED_VERSION="$(cat .build-stable/promote-dev.txt)"
            [ "$DEV_VERSION" = "$REQUIRED_VERSION" ] || {
              echo "DEV version mismatch: expected $REQUIRED_VERSION, got $DEV_VERSION"
              exit 1
            }
            unzip -q dev/dbu-automation-dev.zip -d /tmp/dbu-stable-package
            while IFS= read -r -d '' file; do
              sed -i 's/const MODULE_ID = "dbu-automation-dev";/const MODULE_ID = "dbu-automation";/g' "$file"
              sed -i 's/const DBU_SOCKET = "module.dbu-automation-dev";/const DBU_SOCKET = "module.dbu-automation";/g' "$file"
            done < <(find /tmp/dbu-stable-package/scripts -type f -name '*.js' -print0)
          else
            unzip -q stable/dbu-automation.zip -d /tmp/dbu-stable-package
          fi

          if [ -d .build-stable/overlay ]; then
            rsync -a .build-stable/overlay/ /tmp/dbu-stable-package/
          fi

          if [ -f .build-stable/remove-files.txt ]; then
            while IFS= read -r rel || [ -n "$rel" ]; do
              [ -z "$rel" ] && continue
              rm -f "/tmp/dbu-stable-package/$rel"
            done < .build-stable/remove-files.txt
          fi

          cp .build-stable/package-module.json /tmp/dbu-stable-package/module.json
          cp .build-stable/public-module.json stable/module.json

      - name: Validate Stable JavaScript and localization
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file" >/dev/null
          done < <(find /tmp/dbu-stable-package/scripts -type f -name '*.js' -print0)

          python3 - <<'PY'
          from pathlib import Path
          import json, re, sys

          root = Path("/tmp/dbu-stable-package")
          module = json.loads((root / "module.json").read_text(encoding="utf-8"))

          assert module["id"] == "dbu-automation"
          expected = json.loads(Path(".build-stable/package-module.json").read_text(encoding="utf-8"))["version"]
          assert module["version"] == expected
          public_manifest = json.loads(Path(".build-stable/public-module.json").read_text(encoding="utf-8"))
          assert module == public_manifest, "Installed Stable and public manifests must match"
          assert module.get("manifest") == "https://raw.githubusercontent.com/SupremoBr/dbu-automation-releases/main/stable/module.json"
          assert module.get("download") == "https://raw.githubusercontent.com/SupremoBr/dbu-automation-releases/main/stable/dbu-automation.zip"

          languages = {x["lang"]: x["path"] for x in module.get("languages", [])}
          assert languages.get("pt-BR") == "lang/pt-BR.json"
          assert "en" not in languages

          for path in languages.values():
            json.loads((root / path).read_text(encoding="utf-8"))

          forbidden = []
          for file in (root / "scripts").rglob("*.js"):
              text = file.read_text(encoding="utf-8")
              if 'const MODULE_ID = "dbu-automation-dev"' in text:
                  forbidden.append(f"{file.relative_to(root)}: hardcoded DEV MODULE_ID")
              if 'const DBU_SOCKET = "module.dbu-automation-dev"' in text:
                  forbidden.append(f"{file.relative_to(root)}: hardcoded DEV socket")
          if forbidden:
              print("Forbidden DEV namespace references in Stable package:")
              print("\n".join(forbidden))
              sys.exit(1)

          missing = []
          pattern = re.compile(r'''(?:import|export)\s+(?:[^"'\n]+?\s+from\s+)?["'](\.[^"']+)["']''')
          for file in (root / "scripts").rglob("*.js"):
              text = file.read_text(encoding="utf-8")
              for rel in pattern.findall(text):
                  target = (file.parent / rel).resolve()
                  candidates = [target] if target.suffix else [Path(str(target) + ".js"), target / "index.js"]
                  if not any(p.exists() for p in candidates):
                      missing.append(f"{file.relative_to(root)} -> {rel}")

          if missing:
              print("Missing relative imports:")
              print("\n".join(missing))
              sys.exit(1)
          PY

      - name: Verify promoted DEV package parity
        if: ${{ hashFiles('.build-stable/promote-dev.txt') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root=Path('/tmp/dbu-stable-package')
          with ZipFile('dev/dbu-automation-dev.zip') as source:
              for item in source.infolist():
                  if item.is_dir() or item.filename == 'module.json':
                      continue
                  path = root / item.filename
                  expected=source.read(item.filename)
                  if item.filename.startswith('scripts/') and item.filename.endswith('.js'):
                      expected=(expected.decode('utf-8')
                        .replace('const MODULE_ID = "dbu-automation-dev";','const MODULE_ID = "dbu-automation";')
                        .replace('const DBU_SOCKET = "module.dbu-automation-dev";','const DBU_SOCKET = "module.dbu-automation";')
                        .encode('utf-8'))
                  assert path.read_bytes() == expected, f'Unexpected promoted file difference: {item.filename}'
          print('Full DEV-to-Stable package parity: PASS')
          PY

      - name: Rebuild and verify Stable ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f stable/dbu-automation.zip
          (cd /tmp/dbu-stable-package && zip -qr "$GITHUB_WORKSPACE/stable/dbu-automation.zip" .)
          unzip -t stable/dbu-automation.zip >/dev/null

      - name: Publish Stable package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("stable/module.json"))["version"])')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stable/module.json stable/dbu-automation.zip
          git rm -rf .build-stable
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "release: publish DBU Automation Stable v${VERSION} [skip ci]"
          git push
