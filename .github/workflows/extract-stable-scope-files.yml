name: Extract Stable scope files

on:
  push:
    branches: [main]
    paths:
      - '.inspect-stable-extract/**'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact Stable files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dbu-stable
          mkdir -p /tmp/dbu-stable .inspect-stable/scripts/combat
          unzip -q stable/dbu-automation.zip -d /tmp/dbu-stable

          mkdir -p .inspect-stable/scripts
          cp /tmp/dbu-stable/scripts/combat/defense-core.js .inspect-stable/scripts/combat/defense-core.js
          cp /tmp/dbu-stable/scripts/area-attack.js .inspect-stable/scripts/area-attack.js
          cp /tmp/dbu-stable/scripts/maneuvers.js .inspect-stable/scripts/maneuvers.js
          cp /tmp/dbu-stable/scripts/visual-config.js .inspect-stable/scripts/visual-config.js
          cp /tmp/dbu-stable/scripts/bootstrap.js .inspect-stable/scripts/bootstrap.js
          cp /tmp/dbu-stable/scripts/gm-panel.js .inspect-stable/scripts/gm-panel.js
          cp /tmp/dbu-stable/scripts/recovery.js .inspect-stable/scripts/recovery.js
          cp /tmp/dbu-stable/scripts/intervene.js .inspect-stable/scripts/intervene.js
          cp /tmp/dbu-stable/scripts/action-economy.js .inspect-stable/scripts/action-economy.js

      - name: Save exact Stable files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .inspect-stable
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: snapshot exact Stable scope files [skip ci]"
          git push
