name: Inspect current DEV source

on:
  push:
    branches: [main]
    paths:
      - '.inspect-request/**'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract current DEV transformation source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dbu-current
          mkdir -p /tmp/dbu-current .inspect
          unzip -q dev/dbu-automation-dev.zip -d /tmp/dbu-current
          cp /tmp/dbu-current/scripts/transformations.js .inspect/transformations.js
          cp /tmp/dbu-current/scripts/main.js .inspect/main.js
          cp /tmp/dbu-current/module.json .inspect/module.json
          echo "== transformations timing/hooks =="
          grep -n -E "setTimeout|preUpdateActor|updateActor|sheet\.getData|syncTransformationVisual" /tmp/dbu-current/scripts/transformations.js || true
      - name: Save snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .inspect/transformations.js .inspect/main.js .inspect/module.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: snapshot current DEV transformation source [skip ci]"
          git push
