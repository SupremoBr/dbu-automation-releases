name: Inspect current DEV source

on:
  push:
    branches: [main]
    paths:
      - '.inspect-request/**'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract current DEV attack source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dbu-current
          mkdir -p /tmp/dbu-current .inspect
          unzip -q dev/dbu-automation-dev.zip -d /tmp/dbu-current
          cp /tmp/dbu-current/scripts/attack.js .inspect/attack.js
          echo "== attack capture section =="
          sed -n '1380,1480p' /tmp/dbu-current/scripts/attack.js
      - name: Save snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .inspect/attack.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: snapshot current DEV attack source [skip ci]"
          git push
