name: Inspect current DEV source

on:
  push:
    branches: [main]
    paths:
      - '.inspect-request/**'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current DEV package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/dbu-current
          mkdir -p /tmp/dbu-current
          unzip -q dev/dbu-automation-dev.zip -d /tmp/dbu-current
          echo "== module.json =="
          cat /tmp/dbu-current/module.json
          echo
          echo "== warning search =="
          grep -R -n -F "O DBU não gerou a rolagem" /tmp/dbu-current || true
          grep -R -n -F "Verifique se alguma regra bloqueou o ataque" /tmp/dbu-current || true
          echo
          echo "== attack message watchers =="
          grep -R -n -E "watchNativeAttackMessage|createChatMessage|updateChatMessage|attackReveal|gerou a rolagem|bloqueou o ataque" /tmp/dbu-current/scripts || true
